[pytest]
# Pin the rootdir to the repo root and put it on sys.path, so the test
# modules can import the top-level scripts (onhw_models, onhw_seq2seq)
# no matter how pytest is invoked (bare `pytest` in CI, `python -m pytest`,
# or `pytest path/to/tests` from another directory).
pythonpath = .
testpaths = tests
