name: CI

# Least privilege: this workflow only checks out code and runs tests. Without
# an explicit block it inherits the repository default, which can include
# write access to contents, packages and more.
permissions:
  contents: read

on:
  # Docs-only changes (README/CLAUDE.md/docs/**) skip this whole pipeline --
  # nothing here builds or tests markdown. A push/PR that touches even one
  # non-doc file still runs everything; paths-ignore only fires when EVERY
  # changed file matches.
  push:
    branches: [ main, OfflineHW ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU wheel index keeps the torch install small on CI runners
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
          fi

      - name: Syntax check (compile python files)
        run: |
          set -e
          py_files=$(git ls-files '*.py' || true)
          if [ -n "$py_files" ]; then python -m py_compile $py_files; else echo "No python files to check."; fi

      - name: Lint (black + pylint)
        run: |
          python -m pip install black pylint >/dev/null
          py_files=$(git ls-files '*.py')
          black --check --diff $py_files
          # Source and tests are scored separately: tests/.pylintrc relaxes the
          # pytest conventions pylint reads as defects (fixture shadowing,
          # private-helper access) without lowering the bar for the source tree.
          pylint --fail-under=9.0 $(git ls-files '*.py' ':!tests/*')
          pylint --fail-under=9.0 --rcfile=tests/.pylintrc tests/

      - name: Run pytest (if present)
        run: |
          if [ -d tests ] || ls *test*.py >/dev/null 2>&1; then
            python -m pip install pytest >/dev/null || true
            # python -m guarantees pytest runs on the same interpreter pip
            # installed into (bare `pytest` may resolve to another Python)
            python -m pytest -q
          else
            echo "No tests found, skipping pytest"
          fi
