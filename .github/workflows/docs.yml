name: Docs style

# ci.yml ignores Markdown-only changes, so the writing rules in AGENTS.md get
# their own light job. It needs no TensorFlow: only pytest and git.
permissions:
  contents: read

on:
  push:
    branches: [ main ]
    paths: [ '**/*.md', 'tests/test_docs_style.py', '.github/workflows/docs.yml' ]
  pull_request:
    branches: [ main ]
    paths: [ '**/*.md', 'tests/test_docs_style.py', '.github/workflows/docs.yml' ]

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_docs_style.py
